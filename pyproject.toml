[project]
name = "softway-project"
version = "0.1.0"
description = ""
authors = [
    {name = "\"\""}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.132.0,<0.133.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "uvicorn (>=0.41.0,<0.42.0)",
    "arq (>=0.27.0,<0.28.0)",
    "python-dotenv (>=1.2.1,<2.0.0)",
    "pydantic-settings (>=2.0.0,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.optional-dependencies]
dev = [
    "ruff",
    "black",
    "isort",
    "mypy",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.isort]
profile = "black"
py_version = 313

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
strict = false

[dependency-groups]
dev = [
    "ruff (>=0.15.2,<0.16.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.0,<9.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "pytest (>=8.0.0,<9.0.0)",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
